[build]
  command = "echo 'Static site - no build needed'"
  publish = "output"

# Serve franchise.html for /franchise
[[redirects]]
  from = "/franchise"
  to = "/franchise.html"
  status = 200
  force = true

# Serve contact-form.html for /contact or /contacto
[[redirects]]
  from = "/contact"
  to = "/contact-form.html"
  status = 200
  force = true

[[redirects]]
  from = "/contacto"
  to = "/contact-form.html"
  status = 200
  force = true

# Default to index.html only for root
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[headers]
  [[headers.values]]
    key = "Cache-Control"
    value = "max-age=3600"
  [[headers.values]]
    key = "X-Content-Type-Options"
    value = "nosniff"
  [[headers.values]]
    key = "X-Frame-Options"
    value = "DENY"
